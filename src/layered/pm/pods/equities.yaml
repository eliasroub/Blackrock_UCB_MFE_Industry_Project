# Equities pod — US equity direction from the market-internals panel.
# See _TEMPLATE.yaml for the full field-by-field contract.
#
# Axis (declared, never fitted): UPWARD PRESSURE ON EQUITY PRICES (+1 = risk-on).
#
# US-only: the three regional analysts (ea/uk/jp equity) were removed in the
# US-only refocus — this pod now arbitrates the four r7 internals analysts.
# Their vendored data and corpora stay in data/ for a possible revival.
#
# The trade block is RETURNS-space (`space: return`), not yield-space: the
# follow-up the earlier "NO trade" note promised. `evaluation/sp_score.py` is
# the grader (weighted next-month SPTR excess return); the yield-space
# `trade_pnl` path is skipped for this pod by the runners. The PM's sized SPY
# leg is a SECONDARY metric — the preregistered primary is the deterministic
# polarity-map of the driver block, which every arm and baseline shares.

display_name: "Equities — US direction from the market-internals panel"

clock_freq: ME

# Per-driver convictions are about each driver's OWN headline measurement — the only
# setting under which ic_pm and ic_analyst compare like for like.
answer_space: driver

board:
  stale_after_days: 45
  expire_after_days: 95

listens_to:
  sector_breadth:
    polarity: +1            # breadth up = more sectors participate = risk-on
  vol_regime:
    polarity: -1            # vix_level up = implied vol rises = risk-off
  risk_appetite:
    polarity: +1            # curve_slope_bp up = steepening = growth-positive
  positioning:
    polarity: +1            # asset_mgr_z up = managers add net longs = risk-on flow

reads: all

mandate:
  - "Judge whether US equities rise or fall over the horizon."
  - "Weigh the four internals analysts against each other: breadth and positioning are participation and flow; the volatility regime and risk appetite are the price of risk."
  - "Internals disagreeing is the interesting case: narrowing breadth under a calm vol regime, or crowded positioning against fading risk appetite — say which panel you trust and why."

weighing:
  staleness:    "A STALE internals read (breadth, vol) still decays — the panel is graded on a monthly clock; discount a view that has missed a month-end."
  disagreement: "The four panels measure different things — participation, flow, and the price of risk can genuinely diverge; that configuration is information, not noise to average away."
  gaps:         "Use the missing-inputs graph: each analyst sees only its own panel — you are the only seat holding all four."
  override:     "Override an analyst only where the cross-panel read changes the picture; never re-litigate an analyst's own-panel evidence from another panel alone."

trade:
  universe: [SPY]
  max_legs: 1
  # Which space the leg weights live in. `return` = signed exposure to the
  # instrument's next-period RETURN (long/short), graded by sp_score; the
  # default (unset) is yield-space, graded by trade_pnl. The tool's leg-weight
  # description is generated from this key so the model is never told yield
  # semantics for an equity instrument.
  space: return
  mandate:
    - "One sized US equity position: a single SPY leg, positive = long, negative = short, scaled to your conviction."
    - "Must NOT be a relative-value or spread trade — this seat expresses direction only."
  risk_tags: [breadth, volatility, positioning, flow, policy, macro]
